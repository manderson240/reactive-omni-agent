[project]
name = "reactive-omni-agent"
version = "0.1.0"
description = "Reactive Sentinel: Autonomous AI Agent & Cross-Chain Invariant Guardian for Reactive Omni"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mike Anderson", email = "manderson240@gmail.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "web3>=7.0.0",
]

[project.scripts]
sentinel = "reactive_sentinel.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reactive_sentinel"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
